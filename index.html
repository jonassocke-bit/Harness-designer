<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111216">
  <title>Harness Designer V2.0.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="topbar">
    <button id="toolRing" class="tool active">Ring</button>
    <button id="toolConnect" class="tool">Verbinden</button>
    <button id="toolPanel" class="tool">Fläche</button>
    <button id="mirrorToggle" class="tool">Spiegel</button>
  </div>

  <div id="historybar">
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
  </div>

  <aside id="drawer">
    <div id="drawerGrip"></div>
    <div id="selectionNone" class="section">
      <h3>Harness Designer V2</h3>
      <p>Ring setzen, verbinden oder Fläche erstellen.</p>
    </div>

    <div id="nodePanel" class="section hidden">
      <h3>Ring / Punkt</h3>
      <label>Ring <input id="nodeRing" type="checkbox" checked></label>
      <label>Durchmesser <input id="nodeDiameter" type="range" min="4" max="100" step="1"><span id="nodeDiameterVal"></span></label>
      <label>Stärke <input id="nodeThickness" type="range" min="2" max="30" step="1"><span id="nodeThicknessVal"></span></label>
      <div class="row"><button id="nodeLock">Sperren</button><button id="nodeDelete">Löschen</button></div>
      <div class="row"><button id="nodeUnlink">Trennen</button><button id="nodeMirror">Spiegeln</button></div>
    </div>

    <div id="strapPanel" class="section hidden">
      <h3>Riemen</h3>
      <label>Breite <input id="strapWidth" type="range" min="4" max="80" step="1"><span id="strapWidthVal"></span></label>
      <div class="row"><button id="strapDebug">Debug</button><button id="strapDelete">Löschen</button></div>
      <div class="row"><button id="strapUnlink">Trennen</button></div>
      <p class="hint">Auto-Strip ist der einzige Riemenmodus.</p>
    </div>

    <div id="panelPanel" class="section hidden">
      <h3>Fläche</h3>
      <label>Abstand <input id="panelOffset" type="range" min="0" max="5" step=".1"><span id="panelOffsetVal"></span></label>
      <div class="row"><button id="panelDelete">Löschen</button></div>
    </div>

    <div id="bodyPanel" class="section">
      <h3>Körper</h3>
      <label>Modell
        <select id="bodyModel">
          <option value="female_custom_morph.glb">Female</option>
          <option value="male_custom_morph.glb">Male</option>
        </select>
      </label>
      <label>Farbe <input id="bodyColor" type="color" value="#e9e9e9"></label>
      <label>Globaler Abstand <input id="surfaceOffset" type="range" min="0" max="8" step=".1"><span id="surfaceOffsetVal"></span></label>
      <div class="row"><button id="hitboxDebug">Hitboxen</button><button id="clearBtn">Neu</button></div>
    </div>

    <div id="buildHelp" class="section hidden">
      <h3 id="buildTitle"></h3>
      <p id="buildText"></p>
      <button id="buildConfirm" class="hidden">Fläche erstellen</button>
      <button id="buildCancel">Abbrechen</button>
    </div>
  </aside>

  <div id="status">V2 Alpha</div>

  <div id="bootOverlay" style="position:fixed;inset:0;z-index:9999;background:#111216;color:#fff;display:flex;align-items:center;justify-content:center;font:600 16px system-ui;-webkit-font-smoothing:antialiased"><div style="width:min(82vw,420px)"><div style="font-size:22px;margin-bottom:14px">Harness Designer V2</div><div id="bootStatus" style="opacity:.72">Starte…</div><pre id="bootError" style="white-space:pre-wrap;font:12px ui-monospace,monospace;color:#ff9b9b;margin-top:16px"></pre></div></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
