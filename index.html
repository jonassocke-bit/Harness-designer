<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harness Designer">
  <title>Harness Designer V1.3</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <main id="viewport"><canvas id="scene"></canvas></main>

  <div id="chrome">
    <input id="modelInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden>

    <div class="top-row">
      <div class="history-group">
        <button id="undoBtn" class="circle-btn icon-undo" aria-label="Rückgängig"></button>
        <button id="redoBtn" class="circle-btn icon-redo" aria-label="Wiederholen"></button>
      </div>

      <div id="buildTools" class="build-tools">
        <button class="tool active" data-tool="ring">+ Ring</button>
        <button class="tool" data-tool="connect">↔ Verbinden</button>
      </div>

      <div class="utility-group">
        <button id="mirrorToggle" class="circle-btn icon-mirror" aria-label="Spiegelmodus" aria-pressed="false"></button>
        <button id="mirrorSelectedBtn" class="circle-btn icon-diamond" aria-label="Auswahl spiegeln"></button>
        <button id="rotateModelBtn" class="circle-btn icon-rotate" aria-label="Modell"></button>
      </div>
    </div>

    <button id="restoreUI" class="restore-ui hidden" aria-label="Menüs einblenden">›</button>

    <section id="selectionPanel" class="sheet hidden">
      <div class="grabber" aria-label="Menühöhe ändern"></div>
      <div class="sheet-scroll">
        <div class="selection-head">
          <div class="selection-name">
            <span id="selectionLabel">AUSWAHL</span>
            <strong id="selectionTitle">Element</strong>
          </div>
          <button id="lockSelectedBtn" class="head-btn icon-lock" aria-label="Sperren"></button>
          <button id="deleteSelectedBtn" class="head-btn danger icon-trash" aria-label="Löschen"></button>
        </div>

        <div id="nodeControls" class="control-group hidden">
          <div class="toggle-line">
            <span>Ring</span>
            <button id="nodeRingToggle" class="switch active" aria-pressed="true">An</button>
          </div>

          <div id="pointSizeControl" class="parameter hidden">
            <div class="parameter-top"><span>Punktgröße</span><div id="pointSizeTools" class="parameter-tools"></div></div>
            <input id="pointSizeSlider" type="range" min="0" max="30" step="1" value="8">
          </div>

          <div id="ringDiameterControl" class="parameter">
            <div class="parameter-top"><span>Ringdurchmesser</span><div id="ringDiameterTools" class="parameter-tools"></div></div>
            <input id="ringDiameterSlider" type="range" min="0" max="100" step="1" value="40">
          </div>

          <div id="ringThicknessControl" class="parameter">
            <div class="parameter-top"><span>Ringstärke</span><div id="ringThicknessTools" class="parameter-tools"></div></div>
            <input id="ringThicknessSlider" type="range" min="0" max="20" step="0.5" value="6">
          </div>
        </div>

        <div id="strapControls" class="control-group hidden">
          <div class="parameter">
            <div class="parameter-top"><span>Breite</span><div id="strapWidthTools" class="parameter-tools"></div></div>
            <input id="strapWidthSlider" type="range" min="0" max="100" step="1" value="30">
          </div>

          <div class="parameter">
            <div class="parameter-top">
              <span>Lockerheit</span>
              <div id="strapSlackTools" class="parameter-tools"></div>
            </div>
            <input id="strapSlackSlider" type="range" min="0" max="100" step="1" value="8">
            <div class="range-caption"><span>Straff</span><span>Locker</span></div>
          </div>

          <div class="curve-box">
            <div class="curve-title">
              <span>Kurvenpunkte</span>
              <strong id="curvePointCount">Auto · 1</strong>
            </div>
            <div class="curve-actions">
              <button id="curveMinusBtn" class="soft-btn">− Punkt</button>
              <button id="curvePlusBtn" class="soft-btn">+ Punkt</button>
              <button id="curveAutoBtn" class="soft-btn">Auto</button>
            </div>
          </div>

          <button id="addAnchorBtn" class="primary-btn">+ Anker auf Riemen</button>
        </div>
      </div>
    </section>

    <section id="modelPanel" class="sheet compact-sheet hidden">
      <div class="grabber"></div>
      <div class="sheet-scroll">
        <div class="selection-head">
          <div class="selection-name"><span>3D MODELL</span><strong>Ausrichtung</strong></div>
          <button id="closeModelPanelBtn" class="head-btn icon-close" aria-label="Schließen"></button>
        </div>

        <div class="model-actions">
          <button id="uploadModelBtn" class="soft-btn">Eigenes Modell laden</button>
          <button id="reloadModelBtn" class="soft-btn">Standardmodell</button>
        </div>

        <div class="parameter">
          <div class="parameter-top"><span>X-Achse</span><div id="rotXTools" class="parameter-tools"></div></div>
          <input id="rotXSlider" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <div class="parameter">
          <div class="parameter-top"><span>Y-Achse</span><div id="rotYTools" class="parameter-tools"></div></div>
          <input id="rotYSlider" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <div class="parameter">
          <div class="parameter-top"><span>Z-Achse</span><div id="rotZTools" class="parameter-tools"></div></div>
          <input id="rotZSlider" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <div class="parameter">
          <div class="parameter-top"><span>Abstand zum Modell</span><div id="surfaceOffsetTools" class="parameter-tools"></div></div>
          <input id="surfaceOffsetSlider" type="range" min="0" max="30" step="0.5" value="2">
        </div>
        <button id="rotationResetBtn" class="primary-btn">Rotation zurücksetzen</button>
      </div>
    </section>

    <div id="modePill" class="mode-pill">
      <button class="mode active" data-mode="build">Bauen</button>
      <button class="mode" data-mode="accessories">Accessoires</button>
      <button class="mode" data-mode="photo">Foto</button>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div class="version-badge">v1.3</div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
